<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Web</title>

    <!-- SEO cơ bản -->
    <meta name="description" content="Mô tả ngắn cho trang web" />
    <meta name="keywords" content="html, css, javascript" />
    <meta name="author" content="Your Name" />

    <!-- Favicon -->

    <!-- CSS -->

    <style>
      /* CSS nhanh nếu chưa tách file */
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      #frame3d {
        width: 100%;
        height: 100%;
      }

      body {
        width: 100svw;
        height: 100svh;
        margin: 0px !important;
      }
      body,
      html {
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <iframe
      id="frame3d"
      src="https://triton5.vercel.app"
      frameborder="0"
      allowfullscreen
    ></iframe>

    <script>
      window.addEventListener("message", function (event) {
        if (event.data?.action === "get_parent_url") {
          const iframeEle = document.getElementById("frame3d");
          iframeEle.contentWindow.postMessage(
            {
              action: "return_parent_url",
              url: window.location.href,
            },
            "*"
          );
        }
      });
    </script>
  </body>
</html>
